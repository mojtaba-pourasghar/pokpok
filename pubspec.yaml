name: popo
description: "پوپو — ببین، لمس کن، کشف کن! دنیای بازی، کشف و خلاقیت برای کودکان ۲ تا ۸ سال"
publish_to: 'none'

# شماره‌ی ساخت (+1) همان versionCode اندروید و CFBundleVersion iOS است.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  hive_ce: ^2.21.0
  hive_ce_flutter: ^2.4.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/scenes/
    - assets/art/animals/
    - assets/art/nature/
    - assets/art/home/
    - assets/art/city/
    - assets/art/music/
    - assets/art/art/
    - assets/art/construction/
    - assets/art/cards/
    - assets/art/backgrounds/
    - assets/art/character/
    - assets/art/characters/
    - assets/art/items/
    - assets/audio/ui/
    - assets/audio/sfx/
    - assets/audio/animals/
    - assets/audio/ambient/
    - assets/audio/instruments/
    - assets/audio/music/
    - assets/audio/voice/
    # کلید عمومی خبرها (notice-key.pub) که استودیو می‌سازد؛ بی آن هیچ خبری پذیرفته نمی‌شود.
    - assets/notices/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
